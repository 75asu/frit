apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

# Monitoring CRs (need the Prometheus Operator CRDs from apps-controllers) + Grafana dashboards.
resources:
  - grafana-externalsecret.yaml
  - vllm-slo-dashboard.yaml

# Ray's OWN auto-generated Grafana dashboards, pulled from the running head pod
# (/tmp/ray/session_latest/metrics/grafana/dashboards/). These are the official Ray dashboards and
# match our exact ray_serve_* metrics + labels, so nothing is hand-authored.
#   serve + serve-deployment  -> ray_serve_* (request rate, queue, latency, replicas) , LIVE now (step 1)
#   serve-llm                 -> the vLLM ENGINE metrics. Ray exports vllm:* engine metrics (default-on
#     since Ray 2.51, log_engine_metrics) sanitized to ray_vllm_* (TTFT/ITL/TPOT, e2e latency, prompt+
#     generation tokens, prefix-cache), already scraped by the step-1 PodMonitor. This board (Ray's own,
#     40 panels) queries those exact ray_vllm_* names, so no config change was needed to light it up.
#     KNOWN GAP (do not chase): 4 of the 44 panels stay "No data" -- the vLLM SCHEDULER GAUGES
#     num_requests_running / _waiting / _swapped and kv_cache_usage_perc. Ray's log_engine_metrics
#     forwards vLLM histograms+counters but NOT those gauges in this Ray 2.56 / vLLM 0.22 (V1 engine)
#     combo. Not a scrape bug. KV-reuse is still covered by ray_vllm_prefix_cache_hits/queries_total,
#     and in-flight/queue depth by the step-1 ray_serve_deployment_queued_queries panels.
# Delivered as a ConfigMap labelled grafana_dashboard=1, which the kube-prometheus-stack Grafana
# sidecar auto-imports (same mechanism as vllm-slo-dashboard).
configMapGenerator:
  - name: ray-serve-grafana-dashboards
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - serve.json=dashboards/serve_grafana_dashboard.json
      - serve-deployment.json=dashboards/serve_deployment_grafana_dashboard.json
      - serve-llm.json=dashboards/serve_llm_grafana_dashboard.json

  # GPU HARDWARE layer (step 3). NVIDIA's official DCGM dashboard (grafana.com gnetId 12239), delivered
  # by the gpu-operator's nvidia-dcgm-exporter (already scraped via its own ServiceMonitor). Community
  # artifact, not hand-authored; normalized only to drop the import-wizard __inputs and bake our default
  # Prometheus datasource in place of ${DS_PROMETHEUS}. Panels: GPU util, framebuffer mem, power, SM
  # clock, temp, tensor-core active -- the hardware view under the serve-llm engine view.
  # KNOWN GAP: the "GPU SM/Tensor activity" panel (DCGM_FI_PROF_PIPE_TENSOR_ACTIVE) reads 0 even at
  # 100% util -- the exporter's DCGM PROFILING collectors (DCGM_FI_PROF_*) aren't sampling here. Util/
  # power/mem/clock/temp are the DEV_* fields and work; the PROF_* tensor-core panel needs the profiling
  # module enabled on the dcgm-exporter (follow-up, not a scrape bug).
  - name: gpu-dcgm-grafana-dashboard
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
    files:
      - dcgm.json=dashboards/dcgm-exporter-dashboard.json
