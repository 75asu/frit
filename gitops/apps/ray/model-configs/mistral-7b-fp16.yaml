# frit MODEL 2 , Mistral-7B-Instruct v0.2 , FP16 unquantized (the QUALITY BASELINE).
# Full-precision weights (~14GB) -> highest accuracy, but slowest decode + least KV headroom on the 24GB L4.
# Bench mistral7b-fp16-sweep (single L4, 256/128): 17.5 tok/s single-stream, TTFT 218ms, ITL 56.0ms, KV 5.5 GiB. SLOWEST.
# Shows the quantization tradeoff: decode ITL tracks weight-bytes/token, so fp16 (~14GB) is ~3.3x slower than int4.
# Only one mistral variant is active at a time (../kustomization.yaml serveConfigV2). See README.md.
applications:
  - name: mistral-7b
    route_prefix: /mistral-7b
    import_path: ray.serve.llm:build_openai_app
    args:
      llm_configs:
        - model_loading_config:
            model_id: mistral-7b
            model_source: mistralai/Mistral-7B-Instruct-v0.2   # base UNQUANTIZED fp16 (non-gated)
          deployment_config:
            num_replicas: 1
            max_ongoing_requests: 16
          engine_kwargs:
            tensor_parallel_size: 1
            # NO quantization key -> full fp16 weights
            dtype: float16
            gpu_memory_utilization: 0.9
            max_model_len: 4096
            enforce_eager: false         # CUDA graphs ON
            use_tqdm_on_load: false
          placement_group_config:
            bundles:
              - GPU: 0.9
                CPU: 2
                memory: 8589934592
          runtime_env:
            env_vars:
              VLLM_RAY_PER_WORKER_GPUS: "0.9"
              HF_HUB_DISABLE_XET: "1"
              # native attention (FlashInfer/FLASH_ATTN) on Ada sm_89
