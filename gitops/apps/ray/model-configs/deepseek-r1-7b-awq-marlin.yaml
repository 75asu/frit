# frit MODEL 3 , DeepSeek-R1-Distill-Qwen-7B , AWQ INT4 + Marlin kernel (L4-TUNED). ★ ACTIVE default for this model.
# The un-crippled Ada config: Marlin INT4 GEMM (needs sm_80+), CUDA graphs ON, native FLASH_ATTN. Smallest
# footprint (~4.5 GB weights) => the most KV headroom, which matters most for this long-decode reasoning model.
# model_id/route are identical across variants so the guidellm recipe is variant-agnostic. max_model_len 16384.
# Bench: TBD (run bench-deepseek7b-sweep + bench-deepseek7b-longdecode). One variant active at a time (../kustomization.yaml).
applications:
  - name: deepseek-r1-7b
    route_prefix: /deepseek-r1-7b
    import_path: ray.serve.llm:build_openai_app
    args:
      llm_configs:
        - model_loading_config:
            model_id: deepseek-r1-7b
            model_source: casperhansen/deepseek-r1-distill-qwen-7b-awq   # AWQ INT4 checkpoint (non-gated)
          deployment_config:
            num_replicas: 1
            max_ongoing_requests: 16
          engine_kwargs:
            tensor_parallel_size: 1
            quantization: awq_marlin     # L4 sm_89: Marlin AWQ kernel (faster than plain awq; needs sm_80+)
            dtype: float16
            gpu_memory_utilization: 0.9
            max_model_len: 16384
            enforce_eager: false         # CUDA graphs ON (24GB headroom) -> lower latency / higher tput
            use_tqdm_on_load: false
          placement_group_config:
            bundles:
              - GPU: 0.9
                CPU: 2
                memory: 8589934592
          runtime_env:
            env_vars:
              VLLM_RAY_PER_WORKER_GPUS: "0.9"
              HF_HUB_DISABLE_XET: "1"
              # native attention (FLASH_ATTN) on Ada sm_89
