# frit MODEL 3 , DeepSeek-R1-Distill-Qwen-7B , FP8 dynamic (the L4 sweet spot; Ada-only).
# vLLM dynamic fp8 -> Ada sm_89 fp8 tensor cores (an A100 CANNOT do fp8). ~2x compression, better accuracy
# than INT4 -- a real quality question for a REASONING model, where INT4 error compounds over a long CoT.
# Base weights quantized to fp8 at load. max_model_len 16384. One variant active at a time (../kustomization.yaml).
# Bench: TBD (run bench-deepseek7b-sweep + bench-deepseek7b-longdecode).
applications:
  - name: deepseek-r1-7b
    route_prefix: /deepseek-r1-7b
    import_path: ray.serve.llm:build_openai_app
    args:
      llm_configs:
        - model_loading_config:
            model_id: deepseek-r1-7b
            model_source: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B   # base weights, quantized to fp8 at load (non-gated, Apache-2.0)
          deployment_config:
            num_replicas: 1
            max_ongoing_requests: 16
          engine_kwargs:
            tensor_parallel_size: 1
            quantization: fp8            # vLLM dynamic fp8 -> Ada sm_89 fp8 tensor cores (~7.5GB weights)
            dtype: float16
            gpu_memory_utilization: 0.9
            max_model_len: 16384
            enforce_eager: false         # CUDA graphs ON
            use_tqdm_on_load: false
          placement_group_config:
            bundles:
              - GPU: 0.9
                CPU: 2
                memory: 8589934592
          runtime_env:
            env_vars:
              VLLM_RAY_PER_WORKER_GPUS: "0.9"
              HF_HUB_DISABLE_XET: "1"
              # native attention (FLASH_ATTN) on Ada sm_89
