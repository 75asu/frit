apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespaced so the generated ConfigMap applies cleanly.
namespace: ray

resources:
  - rayservice.yaml
  - serve-service.yaml

# ONE file per BENCHMARKED VARIANT in model-configs/ (self-documenting; the tree mirrors docs/bench/).
# The ACTIVE config is whichever file is injected below as serveConfigV2 , switch by changing this
# ONE line (auditable in git = "which config was live for this benchmark"). Benchmark ONE config at
# a time for clean numbers; the co-host demo (all models + LiteLLM routing) will be its own
# model-configs/cohost.yaml. Available: qwen-05b.yaml + mistral-7b-{awq-marlin,awq-int4,fp8,fp16}.yaml
# , see model-configs/README.md for the full precision/tuning comparison + numbers.
#
# ORDER when onboarding a new model: keep the CURRENT model active, `make sync` (deploys its
# pre-warm CronJob), TRIGGER the pre-warm + wait, THEN flip this line to the new model + sync
# (so Ray loads from the warm cache instead of fighting a cold HF download).
configMapGenerator:
  - name: frit-serve-serveconfig
    files:
      - serveConfigV2=model-configs/deepseek-r1-7b-awq-int4.yaml   # ACTIVE: deepseek-r1-7b AWQ-Marlin (L4-tuned). Switch to any model-configs/*.yaml

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: frit-serve-serveconfig
      fieldPath: data.serveConfigV2
    targets:
      - select:
          kind: RayService
          name: frit-serve
        fieldPaths:
          - spec.serveConfigV2
