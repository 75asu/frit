apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # HelmRepositories
  # (prometheus-community source moved to apps/controllers/monitoring/ — the CRD-provider layer)
  - sources/vllm.yaml
  - sources/open-webui.yaml
  - sources/langfuse.yaml
  - sources/litellm.yaml
  # Monitoring CONFIGS (CRs that need the Prometheus Operator CRDs from apps-controllers).
  # The kube-prometheus-stack chart + namespace live in apps/controllers/monitoring/.
  - monitoring          # grafana ESO + dashboards (vllm-slo + Ray's own serve/serve-deployment)
  # vLLM — inference engine with prefix-aware routing (production-stack chart)
  - vllm/namespace.yaml
  - vllm/helmrelease.yaml
  - vllm/hf-token-externalsecret.yaml
  - vllm/pdb.yaml
  - vllm/servicemonitor.yaml
  # Ray Serve — RayService serving path on one GPU (the KubeRay operator lives in infra).
  # ray/ has its own kustomization: RayService + service. Models = ONE file per model in
  # ray/model-configs/; the active one is injected as serveConfigV2 (switch in ray/kustomization.yaml).
  - ray
  # Model weight pre-warmers — suspended CronJobs (one per model) that download HF weights into
  # the shared hostPath cache with hf_transfer + resume, off the serve path. Manual-trigger.
  - model-warm
  # LiteLLM — dev multi-model gateway (Open WebUI -> LiteLLM -> vLLM), CNPG-backed
  - litellm/namespace.yaml
  - litellm/cluster.yaml
  - litellm/helmrelease.yaml
  # Open WebUI — Claude.ai equivalent frontend, talks to vLLM via OpenAI API
  - open-webui/namespace.yaml
  - open-webui/helmrelease.yaml
  # Langfuse — LLM-native output quality observability (M5)
  - langfuse/namespace.yaml
  - langfuse/helmrelease.yaml
  - langfuse/externalsecret.yaml
  # guidellm — inference load-testing harness. One Job per benchmark run,
  # results to a shared PVC. Own kustomization (like ray/).
  - guidellm
