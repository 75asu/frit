# Benchmark recipe for MODEL 3: deepseek-r1-7b on the Ray Serve endpoint, SWEEP profile, 256/128.
# APPLES-TO-APPLES vs the qwen/mistral sweeps (same 256/128 tokens, sweep_size 10, 60s/strategy) so the
# chat-vs-reasoning comparison is fair. Variant-agnostic: hits whichever config is ACTIVE (model_id/route
# are identical across the 4 deepseek variants). Writes a generic PVC json; the PULL step names the repo
# copy per-variant (docs/bench/results/deepseek7b-<variant>-sweep.json). Trigger with:
#   kubectl -n bench create job ds-sweep --from=cronjob/bench-deepseek7b-sweep
#   kubectl -n bench logs -f ds-sweep
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bench-deepseek7b-sweep
  namespace: bench
  labels:
    app.kubernetes.io/name: guidellm
    bench.frit/model: deepseek-r1-7b
    bench.frit/profile: sweep
spec:
  schedule: "0 0 1 1 *"        # dummy; suspended anyway
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0          # don't retry: surface errors immediately
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: guidellm
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            fsGroup: 0
          containers:
            - name: guidellm
              image: ghcr.io/vllm-project/guidellm:v0.7.1-amd64   # pinned; :latest is arm64-only
              workingDir: /tmp
              env:
                - name: HF_HOME
                  value: /tmp/hf
              command:
                - guidellm
                - run
                - --backend
                - kind=openai_http,target=http://frit-serve-serve-svc.ray.svc.cluster.local:8000/deepseek-r1-7b,model=deepseek-r1-7b,validate_backend=false
                - --tokenizer
                - kind=huggingface_auto,model=deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
                - --data
                - kind=synthetic_text,prompt_tokens=256,output_tokens=128
                - --profile
                - kind=sweep,sweep_size=10
                - --constraint
                - kind=max_duration,seconds=60
                - --output
                - kind=json,path=/results/deepseek7b-sweep.json
              volumeMounts:
                - name: results
                  mountPath: /results
          volumes:
            - name: results
              persistentVolumeClaim:
                claimName: bench-results
