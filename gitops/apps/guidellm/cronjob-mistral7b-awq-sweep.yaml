# Benchmark recipe for MODEL 2: mistral-7b (AWQ INT4) on the Ray Serve endpoint, SWEEP profile.
# Suspended CronJob (never auto-fires); trigger a run with:
#
#   kubectl -n bench create job mistral-sweep --from=cronjob/bench-mistral7b-awq-sweep
#   kubectl -n bench logs -f mistral-sweep
#
# Same knobs as the qwen sweep (256/128 tokens, sweep_size 10, 60s/strategy) so the two
# models are apples-to-apples. Writes a multi-benchmark json to the shared bench-results PVC.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bench-mistral7b-awq-sweep
  namespace: bench
  labels:
    app.kubernetes.io/name: guidellm
    bench.frit/model: mistral-7b
    bench.frit/precision: awq-int4
    bench.frit/profile: sweep
spec:
  schedule: "0 0 1 1 *"        # dummy; suspended anyway
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0          # don't retry: surface errors immediately
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: guidellm
        spec:
          restartPolicy: Never
          securityContext:
            runAsUser: 0
            fsGroup: 0
          containers:
            - name: guidellm
              image: ghcr.io/vllm-project/guidellm:v0.7.1-amd64   # pinned; :latest is arm64-only
              workingDir: /tmp
              env:
                - name: HF_HOME
                  value: /tmp/hf
              command:
                - guidellm
                - run
                - --backend
                - kind=openai_http,target=http://frit-serve-serve-svc.ray.svc.cluster.local:8000/mistral-7b,model=mistral-7b,validate_backend=false
                - --tokenizer
                - kind=huggingface_auto,model=TheBloke/Mistral-7B-Instruct-v0.2-AWQ
                - --data
                - kind=synthetic_text,prompt_tokens=256,output_tokens=128
                - --profile
                - kind=sweep,sweep_size=10
                - --constraint
                - kind=max_duration,seconds=60
                - --output
                - kind=json,path=/results/mistral7b-awq-sweep.json
              volumeMounts:
                - name: results
                  mountPath: /results
          volumes:
            - name: results
              persistentVolumeClaim:
                claimName: bench-results
