apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ray

# Suspended weight-pre-warmer CronJobs, one per model. Trigger manually before serving a
# new model so the cold HF download happens off the serve path (resumable + hf_transfer).
resources:
  - cronjob-warm-mistral-7b.yaml
  - cronjob-warm-deepseek-r1-7b-awq.yaml    # DeepSeek AWQ INT4 (~4.5 GB) -> awq-int4/awq-marlin variants
  - cronjob-warm-deepseek-r1-7b-base.yaml   # DeepSeek base (~15 GB) -> fp8/fp16 variants
