apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# apps-controllers layer: operators + CRD-installing charts for the apps tier. The apps (configs)
# Kustomization dependsOn this with wait:true, so every CRD these install is present before any CR
# that consumes it is dry-run-validated by Flux. Mirrors the fravity-spine controllers/configs split.
resources:
  - monitoring
