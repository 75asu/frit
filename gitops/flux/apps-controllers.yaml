---
# Flux Kustomization — apps-controllers layer (wave between infra and apps).
# Installs the apps-tier operators / CRD-providing charts (kube-prometheus-stack, which brings the
# ServiceMonitor/PodMonitor/PrometheusRule CRDs). wait:true + the HelmRelease health check gate the
# apps layer until the CRDs exist, so apps' ServiceMonitor CRs pass Flux's dry-run on a cold boot.
# Standard production GitOps pattern: controllers (CRDs + operators) reconcile before configs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-controllers
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/apps/controllers
  prune: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: frit
  dependsOn:
    - name: infra
  # Gate on the CRD being Established — that is what apps' ServiceMonitor CRs actually need, and it
  # happens early in the chart install (before Grafana). Do NOT gate on the whole HelmRelease being
  # Ready: kube-prometheus-stack's Grafana blocks on an admin secret produced by ESO in the apps
  # layer, so gating on it would deadlock (apps waits on controllers, controllers waits on apps).
  healthChecks:
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: servicemonitors.monitoring.coreos.com
